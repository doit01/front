<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Word表格解析器 - 提取“物料用量”与“质量控制”之间的表格</title>
    <!-- Mammoth.js 用于解析 .docx -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <!-- docx 库用于动态生成测试 Word 文件 -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 24px;
            color: #0f172a;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 上传卡片 */
        .upload-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            padding: 28px 24px;
            margin-bottom: 32px;
            border: 1px solid #e2edff;
        }
        .upload-area {
            border: 2px dashed #bfdbfe;
            border-radius: 24px;
            padding: 36px 20px;
            background: #fefeff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .upload-hint {
            font-size: 0.9rem;
            color: #2c3e66;
        }
        input[type="file"] { display: none; }
        .btn {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 18px;
            display: inline-block;
            transition: 0.2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-secondary {
            background: #10b981;
            margin-left: 12px;
        }
        .btn-secondary:hover { background: #059669; }
        .status {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 20px;
            background: #f1f5f9;
            font-size: 0.9rem;
        }
        /* 结果卡片 */
        .result-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #e9eef3;
        }
        .result-header {
            background: linear-gradient(95deg, #f8fafd, #ffffff);
            padding: 20px 28px;
            border-bottom: 1px solid #e4e9f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2a3a, #0f3b5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #dbeafe;
            color: #1e3a8a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .table-wrapper {
            padding: 24px 28px 28px;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .data-table th {
            background: #eef3ff;
            color: #0c4a6e;
            font-weight: 700;
            padding: 12px 16px;
            border: 1px solid #dee4ec;
            text-align: center;
        }
        .data-table td {
            padding: 10px 16px;
            border: 1px solid #e6edf4;
            background-color: #ffffff;
        }
        .data-table tr:hover td { background: #fefce8; }
        .col-detail {
            margin-top: 24px;
            background: #f9fbfe;
            border-radius: 24px;
            border: 1px solid #e2edf7;
            padding: 16px 20px;
        }
        .col-detail summary {
            font-weight: 600;
            cursor: pointer;
            color: #2563eb;
            font-size: 0.95rem;
        }
        .col-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .col-box {
            background: white;
            border-radius: 20px;
            border: 1px solid #e0e9f2;
            padding: 14px;
            min-width: 180px;
            flex: 1 1 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .col-box h4 {
            margin: 0 0 10px 0;
            border-bottom: 2px solid #cbdde9;
            padding-bottom: 6px;
            font-weight: 700;
        }
        .col-list {
            margin: 0;
            padding-left: 20px;
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        .empty-message {
            background: #fff3e3;
            padding: 40px;
            text-align: center;
            border-radius: 32px;
            color: #b45309;
            font-weight: 500;
        }
        footer {
            text-align: center;
            margin-top: 44px;
            font-size: 0.75rem;
            color: #6c86a3;
            border-top: 1px solid #e2edf7;
            padding-top: 24px;
        }
        .toolbar { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .table-wrapper { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="upload-card">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📑🔍</div>
            <div class="upload-title">解析 Word 文档中的关键表格</div>
            <div class="upload-hint">自动定位 <strong style="color:#1e40af;">「物料用量」</strong> 与 <strong style="color:#1e40af;">「质量控制」</strong> 标题之间的表格<br>并展示该表格的每一列所有数据</div>
            <input type="file" id="fileInput" accept=".docx">
            <div class="toolbar">
                <button class="btn" id="customUploadBtn">📂 选择文件</button>
                <button class="btn btn-secondary" id="generateTestDocBtn">🧪 生成测试 Word (含物料用量/质量控制区域)</button>
            </div>
        </div>
        <div id="statusMsg" class="status" style="display: none;"></div>
    </div>

    <div id="resultsContainer">
        <div class="empty-message" id="defaultHint">
            ✨ 等待上传包含「物料用量」和「质量控制」标题的 Word 文档<br>
            系统将自动提取两个标题之间的表格，并按列展示数据。<br>
            也可点击上方按钮生成符合要求的测试文档。
        </div>
    </div>
    <footer>
        ⚙️ 解析引擎 Mammoth.js | 精确识别标题区间表格 | 展示每一列完整内容
    </footer>
</div>

<script>
    (function(){
        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const customBtn = document.getElementById('customUploadBtn');
        const generateBtn = document.getElementById('generateTestDocBtn');
        const statusDiv = document.getElementById('statusMsg');
        const resultsContainer = document.getElementById('resultsContainer');

        // 辅助函数：显示消息
        function showStatus(message, isError = false) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = message;
            statusDiv.style.background = isError ? '#fee9e6' : '#e0f2fe';
            statusDiv.style.color = isError ? '#b91c1c' : '#0c4e6e';
            setTimeout(() => {
                if (statusDiv.style.display === 'block') {
                    setTimeout(() => { if(statusDiv) statusDiv.style.opacity = '0.8'; }, 3500);
                }
            }, 3000);
        }

        // 加载动画占位
        function setLoading() {
            resultsContainer.innerHTML = `<div class="empty-message" style="background:#eef2ff; color:#155e75;">⏳ 正在解析文档，定位「物料用量」与「质量控制」之间的表格...</div>`;
        }

        // 安全转义
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        /**
         * 核心：从 Mammoth 生成的 HTML 中提取「物料用量」与「质量控制」两个标题之间的所有表格。
         * 返回第一个表格（通常两个标题间只有一个主表格），也可按需返回多个表格，根据常见场景设计为取第一个表格。
         * 但为了严谨，会提取区域内的所有表格，若存在多个则返回数组，展示时优先展示第一个表格并提示。
         */
        function extractTableBetweenHeadings(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const body = doc.body;
            
            // 获取所有文本节点及元素，遍历找到包含“物料用量”和“质量控制”的元素节点（标题）
            let startElement = null;
            let endElement = null;
            
            // 辅助：判断一个元素或其文本内容是否匹配标题关键词 (忽略大小写、空格)
            function matchesMaterial(text) {
                if(!text) return false;
                // 匹配 “物料用量” 可能前后有空格或标点
                return /物料用量/i.test(text);
            }
            function matchesQuality(text) {
                return /质量控制/i.test(text);
            }
            
            // 深度优先遍历所有元素节点，找到第一个包含“物料用量”的元素作为起始锚点
            const allElements = body.querySelectorAll('*');
            for (let el of allElements) {
                const innerText = el.textContent;
                if (!startElement && matchesMaterial(innerText)) {
                    startElement = el;
                    break;
                }
            }
            if (!startElement) {
                return { error: '未找到包含“物料用量”的标题，请确认文档中存在该关键词。' };
            }
            
            // 从 startElement 之后（排除自身）寻找包含“质量控制”的元素作为结束锚点
            let afterStart = false;
            for (let el of allElements) {
                if (!afterStart && el === startElement) {
                    afterStart = true;
                    continue;
                }
                if (afterStart && matchesQuality(el.textContent)) {
                    endElement = el;
                    break;
                }
            }
            if (!endElement) {
                return { error: '找到“物料用量”，但未找到“质量控制”标题，无法确定表格区间。' };
            }
            
            // 收集两个元素之间的所有表格 (startElement 之后, endElement 之前)
            const tablesInRange = [];
            let collect = false;
            // 重新遍历节点，更精确地提取介于 startElement 和 endElement 之间的表格（包括可能位于中间的任何层级）
            const walker = document.createTreeWalker(body, NodeFilter.SHOW_ELEMENT, {
                acceptNode: (node) => {
                    if (node === startElement) {
                        collect = true;
                        return NodeFilter.FILTER_SKIP; // 跳过起始标题本身
                    }
                    if (node === endElement) {
                        collect = false;
                        return NodeFilter.FILTER_SKIP;
                    }
                    if (collect && node.nodeName === 'TABLE') {
                        return NodeFilter.FILTER_ACCEPT;
                    }
                    return NodeFilter.FILTER_SKIP;
                }
            });
            let currentNode;
            while (currentNode = walker.nextNode()) {
                if (currentNode.nodeName === 'TABLE') {
                    tablesInRange.push(currentNode);
                }
            }
            
            if (tablesInRange.length === 0) {
                return { error: '在“物料用量”与“质量控制”之间未检测到任何表格。请确保两个标题之间有表格存在。' };
            }
            
            // 将第一个表格转换成二维数组（兼容行列合并会导致简单解析不完美，但能提取全部单元格文本）
            const primaryTable = tablesInRange[0];
            const rows = primaryTable.querySelectorAll('tr');
            const matrix = [];
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('th, td');
                if (cells.length === 0) continue;
                const rowData = [];
                for (let c = 0; c < cells.length; c++) {
                    let txt = cells[c].textContent || '';
                    txt = txt.replace(/\s+/g, ' ').trim();
                    rowData.push(txt || '—');
                }
                matrix.push(rowData);
            }
            if (matrix.length === 0) return { error: '表格解析失败，无法获取行数据。' };
            
            return { 
                success: true, 
                tableMatrix: matrix,
                totalTablesInRange: tablesInRange.length,
                extraTables: tablesInRange.length > 1 ? tablesInRange.slice(1) : []
            };
        }
        
        // 渲染表格和按列视图
        function renderTableFromMatrix(matrix, warningMsg = '') {
            if (!matrix || matrix.length === 0) {
                return `<div class="empty-message">⚠️ 表格数据为空，无法展示。</div>`;
            }
            // 计算最大列数
            let maxCols = 0;
            for (let row of matrix) maxCols = Math.max(maxCols, row.length);
            const paddedRows = matrix.map(row => {
                if (row.length < maxCols) return [...row, ...Array(maxCols - row.length).fill('')];
                return row;
            });
            const headerRow = paddedRows[0];
            const dataRows = paddedRows.slice(1);
            
            let html = `<div class="result-card">
                            <div class="result-header">
                                <span class="result-title">📌 物料用量 ⇢ 质量控制 之间的表格</span>
                                <span class="badge">${paddedRows.length} 行 &nbsp;|&nbsp; ${maxCols} 列</span>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>`;
            html += `<tr>`;
            for (let i=0; i<maxCols; i++) {
                let colName = (headerRow[i] && headerRow[i] !== '—') ? headerRow[i] : `列 ${String.fromCharCode(65+i)}`;
                html += `<th>${escapeHtml(colName)}</th>`;
            }
            html += `</thead><tbody>`;
            if (dataRows.length === 0) {
                html += `<tr><td colspan="${maxCols}" style="text-align:center;">🔍 仅有标题行，无数据行</td></tr>`;
            } else {
                for (let r=0; r<dataRows.length; r++) {
                    html += `<tr>`;
                    for (let c=0; c<maxCols; c++) {
                        let val = dataRows[r][c] || '—';
                        html += `<td>${escapeHtml(val)}</td>`;
                    }
                    html += `</tr>`;
                }
            }
            html += `</tbody>`;
            html += `</table>`;
            
            // 按列详细展示 (额外强调每一列的全部数据)
            html += `<div class="col-detail">
                        <details open>
                            <summary>📋 按列查看完整数据（每一列的所有单元格内容）</summary>
                            <div class="col-flex">`;
            for (let col = 0; col < maxCols; col++) {
                const colHeaderRaw = (headerRow[col] && headerRow[col] !== '—') ? headerRow[col] : `列 ${String.fromCharCode(65+col)}`;
                const allValues = [];
                for (let r = 0; r < paddedRows.length; r++) {
                    let val = (paddedRows[r][col] !== undefined && paddedRows[r][col] !== '') ? paddedRows[r][col] : '—';
                    allValues.push(val);
                }
                html += `<div class="col-box">
                            <h4>📌 ${escapeHtml(colHeaderRaw)}</h4>
                            <ul class="col-list">`;
                for (let idx=0; idx<allValues.length; idx++) {
                    let prefix = (idx === 0) ? '🏷️ 表头：' : `📄 行${idx}：`;
                    html += `<li style="margin-bottom: 5px;"><span style="color:#4b5563;">${prefix}</span> <strong>${escapeHtml(allValues[idx])}</strong></li>`;
                }
                html += `</ul></div>`;
            }
            html += `</div></details></div>`;
            if (warningMsg) {
                html += `<div style="margin-top: 16px; background:#fffbeb; padding:12px 20px; border-radius: 20px; color:#b45309;">⚠️ ${escapeHtml(warningMsg)}</div>`;
            }
            html += `</div></div>`;
            return html;
        }
        
        // 解析Word主流程
        async function parseWordDocument(file) {
            if (!file) {
                showStatus('请选择一个 .docx 文件', true);
                return;
            }
            if (!file.name.endsWith('.docx') && file.type !== 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
                showStatus('仅支持 .docx 格式的文件', true);
                return;
            }
            setLoading();
            showStatus('解析文档中，定位标题区间...');
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                const htmlContent = result.value;
                // 提取区间表格
                const extraction = extractTableBetweenHeadings(htmlContent);
                if (extraction.error) {
                    resultsContainer.innerHTML = `<div class="empty-message" style="background:#fff0f0; color:#a1220a;">❌ ${escapeHtml(extraction.error)}<br><br>请确保文档中包含「物料用量」和「质量控制」两个明确标题，并且二者之间存在表格。</div>`;
                    showStatus(extraction.error, true);
                    return;
                }
                if (extraction.success) {
                    const matrix = extraction.tableMatrix;
                    let warningMsg = '';
                    if (extraction.totalTablesInRange > 1) {
                        warningMsg = `检测到「物料用量」与「质量控制」之间共有 ${extraction.totalTablesInRange} 个表格，当前展示第一个表格。如需其他表格请调整文档结构。`;
                    }
                    const renderedHtml = renderTableFromMatrix(matrix, warningMsg);
                    resultsContainer.innerHTML = renderedHtml;
                    showStatus(`✅ 成功提取物料用量与质量控制之间的表格（共 ${extraction.totalTablesInRange} 个表格，展示主表格）`, false);
                } else {
                    resultsContainer.innerHTML = `<div class="empty-message">⚠️ 解析失败，未能获取有效表格数据。</div>`;
                }
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = `<div class="empty-message" style="background:#fee2e2;">❌ 解析出错: ${escapeHtml(err.message || '未知错误')}<br>请确认文档为标准 .docx 格式。</div>`;
                showStatus('解析异常: ' + err.message, true);
            }
        }
        
        // ------------------ 生成测试 Word（包含物料用量标题、表格、质量控制标题） ------------------
        async function generateTestDocument() {
            if (!window.docx) {
                showStatus("生成库未就绪，请刷新页面重试", true);
                return;
            }
            const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType, BorderStyle } = window.docx;
            
            // 构建表格：物料清单表格（物料用量区域表格）
            const materialRows = [
                new TableRow({
                    children: [
                        new TableCell({ children: [new Paragraph({ children: [new TextRun("物料名称")], alignment: AlignmentType.CENTER })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun("规格型号")], alignment: AlignmentType.CENTER })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun("单位用量")], alignment: AlignmentType.CENTER })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun("备注")], alignment: AlignmentType.CENTER })] })
                    ]
                }),
                new TableRow({ children: [ new TableCell(new Paragraph("镀锌钢板")), new TableCell(new Paragraph("2.0mm")), new TableCell(new Paragraph("5.6 kg")), new TableCell(new Paragraph("主材")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("焊条")), new TableCell(new Paragraph("E4303")), new TableCell(new Paragraph("0.8 kg")), new TableCell(new Paragraph("辅材")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("防锈漆")), new TableCell(new Paragraph("灰色环氧")), new TableCell(new Paragraph("0.3 L")), new TableCell(new Paragraph("表面处理")) ] })
            ];
            const materialTable = new Table({
                rows: materialRows,
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE }, insideHorizontal: { style: BorderStyle.SINGLE }, insideVertical: { style: BorderStyle.SINGLE } }
            });
            
            // 构建另一个表格（质量控制区域之后可以再有一个表格，但不影响解析区间，我们保证物料用量和质量控制之间只有上面的物料表格）
            const qualityRows = [
                new TableRow({ children: [ new TableCell(new Paragraph("检验项目")), new TableCell(new Paragraph("标准要求")), new TableCell(new Paragraph("检测频率")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("尺寸偏差")), new TableCell(new Paragraph("±2mm")), new TableCell(new Paragraph("每批次")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("涂层厚度")), new TableCell(new Paragraph("≥60μm")), new TableCell(new Paragraph("抽检")) ] })
            ];
            const qualityTable = new Table({
                rows: qualityRows,
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE }, insideHorizontal: { style: BorderStyle.SINGLE }, insideVertical: { style: BorderStyle.SINGLE } }
            });
            
            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({ children: [new TextRun({ text: "工程物料及质控文档（测试样例）", bold: true, size: 32 })], alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: " ", spacing: { after: 200 } }),
                        new Paragraph({ children: [new TextRun({ text: "物料用量", bold: true, size: 28 })], spacing: { before: 200, after: 120 } }),
                        materialTable,
                        new Paragraph({ children: [new TextRun({ text: "质量控制", bold: true, size: 28 })], spacing: { before: 400, after: 120 } }),
                        qualityTable,
                        new Paragraph({ text: "注：物料用量与质量控制标题之间的表格（即上方物料表格）将会被解析工具提取并按列展示。", spacing: { before: 300 }, alignment: AlignmentType.CENTER })
                    ]
                }]
            });
            
            const blob = await Packer.toBlob(doc);
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = '物料用量_质量控制_测试文档.docx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus("✅ 测试文档已生成！文档包含「物料用量」标题 → 物料表格 → 「质量控制」标题。请使用上传功能验证解析效果。", false);
        }
        
        // 绑定事件
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) parseWordDocument(e.target.files[0]);
        });
        customBtn.addEventListener('click', () => fileInput.click());
        generateBtn.addEventListener('click', generateTestDocument);
        uploadArea.addEventListener('click', (e) => {
            if (e.target !== customBtn && e.target !== generateBtn && e.target !== fileInput) fileInput.click();
        });
        
        // 拖拽
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#3b82f6'; uploadArea.style.background = '#ecf5ff'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#bfdbfe'; uploadArea.style.background = '#fefeff'; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#bfdbfe';
            uploadArea.style.background = '#fefeff';
            const files = e.dataTransfer.files;
            if (files.length && files[0].name.endsWith('.docx')) {
                fileInput.files = files;
                parseWordDocument(files[0]);
            } else showStatus('请拖放 .docx 文件', true);
        });
    })();
</script>
</body>
</html>
