<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>轻量Word表格解析 - 原生XML解析 | 物料用量⇢质量控制区间表格</title>
    <!-- 仅依赖 JSZip 用于解压，XML 解析使用原生 DOMParser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- docx 生成测试文档 (可选) -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4f9;
            margin: 0;
            padding: 24px;
            color: #0a2540;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .upload-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.05);
            padding: 28px 24px;
            margin-bottom: 32px;
            border: 1px solid #e2edff;
        }
        .upload-area {
            border: 2px dashed #bac8e0;
            border-radius: 28px;
            padding: 36px 20px;
            background: #fefeff;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .upload-hint { font-size: 0.9rem; color: #2c5270; }
        input[type="file"] { display: none; }
        .btn {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 18px;
            display: inline-block;
            transition: 0.2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-secondary {
            background: #10b981;
            margin-left: 12px;
        }
        .btn-secondary:hover { background: #059669; }
        .status {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 28px;
            background: #eef2ff;
            font-size: 0.9rem;
            color: #1e3a8a;
        }
        .result-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e9eef3;
        }
        .result-header {
            background: #fafcff;
            padding: 18px 28px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .result-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2f3f, #0f3b5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #e0edff;
            color: #1e4580;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .table-wrapper {
            padding: 24px 28px 28px;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .data-table th {
            background: #eef3ff;
            color: #0c4a6e;
            font-weight: 700;
            padding: 12px 16px;
            border: 1px solid #dee4ec;
            text-align: center;
        }
        .data-table td {
            padding: 10px 16px;
            border: 1px solid #e6edf4;
            background: white;
        }
        .data-table tr:hover td { background: #fefce8; }
        .col-detail {
            margin-top: 24px;
            background: #f9fbfe;
            border-radius: 24px;
            border: 1px solid #e2edf7;
            padding: 16px 20px;
        }
        .col-detail summary {
            font-weight: 600;
            cursor: pointer;
            color: #2563eb;
            font-size: 0.95rem;
        }
        .col-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .col-box {
            background: white;
            border-radius: 20px;
            border: 1px solid #e0e9f2;
            padding: 14px;
            min-width: 190px;
            flex: 1 1 210px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .col-box h4 {
            margin: 0 0 10px 0;
            border-bottom: 2px solid #cbdde9;
            padding-bottom: 6px;
            font-weight: 700;
        }
        .col-list {
            margin: 0;
            padding-left: 20px;
            max-height: 240px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        .empty-message {
            background: #fff3e3;
            padding: 40px;
            text-align: center;
            border-radius: 32px;
            color: #b45309;
            font-weight: 500;
        }
        footer {
            text-align: center;
            margin-top: 44px;
            font-size: 0.75rem;
            color: #6c86a3;
            border-top: 1px solid #e2edf7;
            padding-top: 24px;
        }
        .toolbar { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .table-wrapper { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="upload-card">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">⚡📄</div>
            <div class="upload-title">智能区间表格解析器（原生XML）</div>
            <div class="upload-hint">直接解析 Word 底层 document.xml —— 极速、零依赖<br>自动定位 <strong>「物料用量」</strong> 与 <strong>「质量控制」</strong> 之间的表格，并按列展示全部数据</div>
            <input type="file" id="fileInput" accept=".docx">
            <div class="toolbar">
                <button class="btn" id="customUploadBtn">📂 选择 .docx 文件</button>
                <button class="btn btn-secondary" id="generateTestDocBtn">🧪 生成测试 Word (含物料用量/质量控制)</button>
            </div>
        </div>
        <div id="statusMsg" class="status" style="display: none;"></div>
    </div>
    <div id="resultsContainer">
        <div class="empty-message">
            ✨ 上传包含「物料用量」和「质量控制」标题的 Word 文档<br>
            系统只解析 XML 中两个标题之间的表格，大文档 (100页/10MB) 依然流畅。<br>
            点击上方按钮可生成测试文件。
        </div>
    </div>
    <footer>⚙️ 基于 JSZip + 原生 DOMParser 解析 | 仅提取目标区间表格，内存极省 | 无需 fast-xml-parser</footer>
</div>

<script>
    (function(){
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const customBtn = document.getElementById('customUploadBtn');
        const generateBtn = document.getElementById('generateTestDocBtn');
        const statusDiv = document.getElementById('statusMsg');
        const resultsContainer = document.getElementById('resultsContainer');

        function showStatus(message, isError = false) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = message;
            statusDiv.style.background = isError ? '#fee9e6' : '#e0f2fe';
            statusDiv.style.color = isError ? '#b91c1c' : '#0c4e6e';
            setTimeout(() => {
                if(statusDiv) statusDiv.style.opacity = '0.9';
            }, 4000);
        }

        function setLoading() {
            resultsContainer.innerHTML = `<div class="empty-message" style="background:#eef2ff; color:#155e75;">⏳ 正在解析 document.xml，定位「物料用量」⇢「质量控制」区间表格 ...</div>`;
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m){
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        // 从段落节点中提取纯文本 (处理 w:t 和命名空间)
        function extractTextFromParagraph(paraNode, nsResolver) {
            // paraNode 是 Element (w:p)
            let text = '';
            const textNodes = paraNode.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 't');
            for(let i=0; i<textNodes.length; i++) {
                text += textNodes[i].textContent;
            }
            return text.trim();
        }

        // 从表格节点解析为二维数组 (处理单元格文本)
        function parseTableToMatrix(tableNode) {
            const rows = tableNode.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 'tr');
            if(rows.length === 0) return [];
            const matrix = [];
            for(let i=0; i<rows.length; i++) {
                const cells = rows[i].getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 'tc');
                const rowData = [];
                for(let j=0; j<cells.length; j++) {
                    // 提取单元格内所有文本（段落中 w:t）
                    const texts = cells[j].getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 't');
                    let cellText = '';
                    for(let k=0; k<texts.length; k++) {
                        cellText += texts[k].textContent;
                    }
                    rowData.push(cellText.trim() || '—');
                }
                if(rowData.length > 0) matrix.push(rowData);
            }
            return matrix;
        }

        // 核心: 从 document.xml 字符串中提取两个标题之间的表格
        async function extractTablesBetweenHeadingsFromXML(docxFile, startKeyword="物料用量", endKeyword="质量控制") {
            try {
                const zip = await JSZip.loadAsync(docxFile);
                const xmlFile = zip.file("word/document.xml");
                if (!xmlFile) throw new Error("未找到 word/document.xml，不是有效的 .docx 文件");
                const xmlString = await xmlFile.async("string");
                
                // 使用原生 DOMParser 解析 XML
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "application/xml");
                // 检查解析错误
                const parseError = xmlDoc.querySelector("parsererror");
                if(parseError) throw new Error("XML 解析错误: " + parseError.textContent);
                
                // 获取所有 body 下的直接子节点 (按顺序)
                const body = xmlDoc.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 'body')[0];
                if(!body) throw new Error("未找到 w:body 节点");
                
                // 获取 body 的所有子元素 (保留顺序)
                const children = body.children; // 元素集合，按文档顺序
                // 由于 children 是实时的，转为数组
                const nodeList = [];
                for(let i=0; i<children.length; i++) nodeList.push(children[i]);
                
                // 找到起始段落索引
                let startIdx = -1;
                for(let i=0; i<nodeList.length; i++) {
                    const node = nodeList[i];
                    if(node.localName === 'p' && node.namespaceURI === 'http://schemas.openxmlformats.org/wordprocessingml/2006/main') {
                        const text = extractTextFromParagraph(node);
                        if(text.includes(startKeyword)) {
                            startIdx = i;
                            break;
                        }
                    }
                }
                if(startIdx === -1) return { success: false, error: `未找到包含“${startKeyword}”的标题段落` };
                
                // 收集区间内的表格
                let tablesInRange = [];
                let foundEnd = false;
                for(let j=startIdx+1; j<nodeList.length; j++) {
                    const node = nodeList[j];
                    if(node.localName === 'p' && node.namespaceURI === 'http://schemas.openxmlformats.org/wordprocessingml/2006/main') {
                        const text = extractTextFromParagraph(node);
                        if(text.includes(endKeyword)) {
                            foundEnd = true;
                            break;
                        }
                    }
                    if(node.localName === 'tbl' && node.namespaceURI === 'http://schemas.openxmlformats.org/wordprocessingml/2006/main') {
                        tablesInRange.push(node);
                    }
                }
                if(!foundEnd) return { success: false, error: `找到“${startKeyword}”，但未找到“${endKeyword}”标题，无法确定区间。` };
                if(tablesInRange.length === 0) return { success: false, error: `在“${startKeyword}”与“${endKeyword}”之间未检测到表格。` };
                
                const firstTable = tablesInRange[0];
                const matrix = parseTableToMatrix(firstTable);
                if(!matrix.length) return { success: false, error: "表格解析失败，无法获取行列数据" };
                
                return {
                    success: true,
                    tableMatrix: matrix,
                    totalTablesInRange: tablesInRange.length,
                    warning: tablesInRange.length > 1 ? `区间内共有 ${tablesInRange.length} 个表格，当前展示第一个表格。` : ""
                };
            } catch(err) {
                console.error(err);
                return { success: false, error: err.message || "解析异常" };
            }
        }
        
        // 渲染表格及按列视图
        function renderTableMatrix(matrix, warningMsg = "") {
            if(!matrix || matrix.length === 0) return `<div class="empty-message">表格无有效数据</div>`;
            let maxCols = 0;
            for(let row of matrix) maxCols = Math.max(maxCols, row.length);
            const paddedRows = matrix.map(row => {
                if(row.length < maxCols) return [...row, ...Array(maxCols - row.length).fill("")];
                return row;
            });
            const headerRow = paddedRows[0];
            const dataRows = paddedRows.slice(1);
            
            let html = `<div class="result-card">
                            <div class="result-header">
                                <span class="result-title">📌 「物料用量」 ⇢ 「质量控制」 区间表格</span>
                                <span class="badge">${paddedRows.length} 行 × ${maxCols} 列</span>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>`;
            html += `<tr>`;
            for(let i=0; i<maxCols; i++) {
                let colName = (headerRow[i] && headerRow[i] !== '—') ? headerRow[i] : `列 ${String.fromCharCode(65+i)}`;
                html += `<th>${escapeHtml(colName)}</th>`;
            }
            html += `</thead><tbody>`;
            if(dataRows.length === 0) {
                html += `<tr><td colspan="${maxCols}" style="text-align:center;">仅表头，无数据行</td></tr>`;
            } else {
                for(let r=0; r<dataRows.length; r++) {
                    html += `<tr>`;
                    for(let c=0; c<maxCols; c++) {
                        let val = dataRows[r][c] || "—";
                        html += `<td>${escapeHtml(val)}</td>`;
                    }
                    html += `</tr>`;
                }
            }
            html += `</tbody>`;
            html += `</table>`;
            
            // 按列详细展示
            html += `<div class="col-detail">
                        <details open>
                            <summary>📋 按列展示所有数据（每一列的全部单元格内容）</summary>
                            <div class="col-flex">`;
            for(let col=0; col<maxCols; col++) {
                let colHeaderRaw = (headerRow[col] && headerRow[col] !== '—') ? headerRow[col] : `列 ${String.fromCharCode(65+col)}`;
                let allValues = [];
                for(let r=0; r<paddedRows.length; r++) {
                    let val = (paddedRows[r][col] !== undefined && paddedRows[r][col] !== "") ? paddedRows[r][col] : "—";
                    allValues.push(val);
                }
                html += `<div class="col-box">
                            <h4>📌 ${escapeHtml(colHeaderRaw)}</h4>
                            <ul class="col-list">`;
                for(let idx=0; idx<allValues.length; idx++) {
                    let prefix = (idx===0) ? "🏷️ 表头：" : `📄 行${idx}：`;
                    html += `<li><span style="color:#4b5563;">${prefix}</span> <strong>${escapeHtml(allValues[idx])}</strong></li>`;
                }
                html += `</ul></div>`;
            }
            html += `</div></details></div>`;
            if(warningMsg) {
                html += `<div style="margin-top: 16px; background:#fffbeb; padding:12px 20px; border-radius: 20px; color:#b45309;">⚠️ ${escapeHtml(warningMsg)}</div>`;
            }
            html += `</div></div>`;
            return html;
        }
        
        async function parseDocxFile(file) {
            if(!file) {
                showStatus("请选择文件", true);
                return;
            }
            if(!file.name.endsWith('.docx') && file.type !== 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
                showStatus("请上传 .docx 格式文件", true);
                return;
            }
            setLoading();
            showStatus("正在解析 document.xml，定位目标区间表格 ...");
            try {
                const result = await extractTablesBetweenHeadingsFromXML(file, "物料用量", "质量控制");
                if(!result.success) {
                    resultsContainer.innerHTML = `<div class="empty-message" style="background:#fff0f0;">❌ 解析失败: ${escapeHtml(result.error)}<br><br>请确保文档中包含“物料用量”和“质量控制”标题，且二者之间存在表格。</div>`;
                    showStatus(result.error, true);
                    return;
                }
                const htmlContent = renderTableMatrix(result.tableMatrix, result.warning || "");
                resultsContainer.innerHTML = htmlContent;
                showStatus(`✅ 成功提取目标区间表格，共 ${result.totalTablesInRange} 个表格，已展示主表格数据。`, false);
            } catch(err) {
                resultsContainer.innerHTML = `<div class="empty-message">解析异常: ${escapeHtml(err.message)}</div>`;
                showStatus(err.message, true);
            }
        }
        
        // 生成测试文档
        async function generateTestWord() {
            if(!window.docx) {
                showStatus("docx 库未加载，请刷新重试", true);
                return;
            }
            const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType, BorderStyle } = window.docx;
            
            const materialRows = [
                new TableRow({ children: [ new TableCell({ children: [new Paragraph({ children: [new TextRun("物料名称")], alignment: AlignmentType.CENTER })] }),
                                        new TableCell({ children: [new Paragraph({ children: [new TextRun("规格/型号")], alignment: AlignmentType.CENTER })] }),
                                        new TableCell({ children: [new Paragraph({ children: [new TextRun("单位用量")], alignment: AlignmentType.CENTER })] }) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("热轧钢板")), new TableCell(new Paragraph("Q235B 10mm")), new TableCell(new Paragraph("12.5 kg/m²")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("不锈钢焊条")), new TableCell(new Paragraph("A102 Φ3.2")), new TableCell(new Paragraph("0.9 kg/件")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("环氧富锌底漆")), new TableCell(new Paragraph("灰色，固含≥65%")), new TableCell(new Paragraph("0.25 L/m²")) ] })
            ];
            const materialTable = new Table({
                rows: materialRows,
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE }, insideHorizontal: { style: BorderStyle.SINGLE }, insideVertical: { style: BorderStyle.SINGLE } }
            });
            
            const qualityRows = [
                new TableRow({ children: [ new TableCell(new Paragraph("检测项目")), new TableCell(new Paragraph("验收标准")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("焊缝外观")), new TableCell(new Paragraph("无裂纹、气孔")) ] }),
                new TableRow({ children: [ new TableCell(new Paragraph("涂层厚度")), new TableCell(new Paragraph("≥80μm")) ] })
            ];
            const qualityTable = new Table({
                rows: qualityRows,
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE }, insideHorizontal: { style: BorderStyle.SINGLE }, insideVertical: { style: BorderStyle.SINGLE } }
            });
            
            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({ children: [new TextRun({ text: "生产物料及质控标准", bold: true, size: 34 })], alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: " " }),
                        new Paragraph({ children: [new TextRun({ text: "物料用量", bold: true, size: 28 })], spacing: { after: 150 } }),
                        materialTable,
                        new Paragraph({ children: [new TextRun({ text: "质量控制", bold: true, size: 28 })], spacing: { before: 400, after: 150 } }),
                        qualityTable,
                        new Paragraph({ text: "注：解析器将提取「物料用量」与「质量控制」之间的表格（即上方的物料清单表格）。", spacing: { before: 300 } })
                    ]
                }]
            });
            
            const blob = await Packer.toBlob(doc);
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = "物料用量_质量控制_测试样例.docx";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus("✅ 测试文档已生成，包含「物料用量」→ 物料表格 →「质量控制」，请上传验证高效解析。", false);
        }
        
        // 事件绑定
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length) parseDocxFile(e.target.files[0]);
        });
        customBtn.addEventListener('click', () => fileInput.click());
        generateBtn.addEventListener('click', generateTestWord);
        
        uploadArea.addEventListener('click', (e) => {
            if(e.target !== customBtn && e.target !== generateBtn && e.target !== fileInput) fileInput.click();
        });
        
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#3b82f6'; uploadArea.style.background = '#ecf5ff'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#bac8e0'; uploadArea.style.background = '#fefeff'; });
        uploadArea.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#bac8e0';
            uploadArea.style.background = '#fefeff';
            const files = e.dataTransfer.files;
            if(files.length && files[0].name.endsWith('.docx')) {
                fileInput.files = files;
                parseDocxFile(files[0]);
            } else showStatus("请拖放 .docx 文件", true);
        });
    })();
</script>
</body>
</html>
